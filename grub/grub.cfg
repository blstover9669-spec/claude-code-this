set timeout=3
set default=0
if serial --unit=0 --speed=115200; then
  terminal_input console serial
  terminal_output console serial
fi
# AI OS is 64-bit only: say so plainly instead of failing with a blank screen
if cpuid -l; then set aios_cpu_ok=1; fi
if [ "$aios_cpu_ok" != "1" ]; then
  clear
  echo "AI OS needs a 64-bit processor, and this PC or VM is running as 32-bit."
  echo ""
  echo "VirtualBox: power the VM off, open Settings > General > Basic and set"
  echo "Version to 'Other Linux (64-bit)'. If only 32-bit versions are listed,"
  echo "turn on virtualization (Intel VT-x or AMD-V) in your PC's BIOS settings."
  echo ""
  echo "Press Enter to restart."
  read
  reboot
fi
# graphics for the loading screen and the chat (VESA on BIOS PCs, GOP on UEFI)
insmod all_video
# show how far loading has got while files are read from the disc or USB stick
# (the commands the menu uses load first, so only the system files get a counter)
insmod echo
insmod linux
insmod progress
# GRUB loads only the small starter; the starter shows the loading screen (with games) while it
# reads boot/system.img itself. The text-mode entries load everything up front, like before.
menuentry "AI OS" {
  echo "Starting AI OS..."
  set gfxpayload=1280x800x32,1280x720x32,1024x768x32,auto
  linux /boot/vmlinuz quiet loglevel=3 edd=off
  initrd /boot/starter.img
}
menuentry "AI OS (serial console)" {
  set gfxpayload=text
  linux /boot/vmlinuz console=tty0 console=ttyS0,115200 loglevel=3 edd=off aios.text=1
  initrd /boot/starter.img /boot/system.img
}
menuentry "AI OS (text mode, no graphics)" {
  echo "Loading AI OS..."
  set gfxpayload=text
  linux /boot/vmlinuz quiet loglevel=3 edd=off aios.text=1
  initrd /boot/starter.img /boot/system.img
}
menuentry "AI OS (show boot messages)" {
  echo "Starting AI OS with all boot messages shown..."
  set gfxpayload=1280x800x32,1280x720x32,1024x768x32,auto
  linux /boot/vmlinuz loglevel=7 edd=off
  initrd /boot/starter.img
}
